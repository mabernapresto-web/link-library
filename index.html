<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marshall Reddick | Link Library</title>
<style>
  :root {
    --brand: #3E6876;
    --brand-dark: #315765;
    --bg: #f5f7f8;
    --card: #ffffff;
    --text: #263238;
    --muted: #66757c;
    --border: #d9e1e4;
    --danger-bg: #fff1f1;
    --danger: #b42318;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--brand);
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  header img {
    width: min(560px, 90vw);
    height: auto;
    display: block;
  }

  main {
    width: min(1180px, calc(100% - 32px));
    margin: 32px auto 50px;
  }

  .page-title {
    text-align: center;
    margin-bottom: 28px;
  }

  .page-title h1 {
    margin: 0 0 8px;
    font-size: 30px;
    color: var(--brand-dark);
  }

  .page-title p {
    margin: 0;
    color: var(--muted);
  }

  .search-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 28px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .section-heading h2 {
    margin: 0;
    color: var(--brand-dark);
    font-size: 22px;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 14px;
    align-items: end;
  }

  label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 7px;
    color: var(--text);
  }

  input[list] {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 17px;
    background: #fff;
    color: var(--text);
    outline: none;
  }

  .combo {
    position: relative;
  }

  .combo input {
    width: 100%;
    height: 44px;
    padding: 0 42px 0 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 17px;
    background: #fff;
    color: var(--text);
    outline: none;
  }

  .combo input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(62,104,118,.12);
  }

  .combo-arrow {
    position: absolute;
    right: 1px;
    top: 1px;
    width: 40px;
    height: 42px;
    padding: 0;
    border-radius: 0 7px 7px 0;
    background: transparent;
    color: var(--brand-dark);
    font-size: 19px;
    z-index: 2;
  }

  .combo-arrow:hover {
    background: #eef3f4;
  }

  .combo-menu {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 240px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }

  .combo-menu.open {
    display: block;
  }

  .combo-option {
    padding: 11px 13px;
    font-size: 16px;
    cursor: pointer;
  }

  .combo-option:hover {
    background: #eef3f4;
    color: var(--brand-dark);
  }

  input[list]:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(62,104,118,.12);
  }

  button {
    height: 44px;
    border: 0;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .search-btn {
    background: var(--brand);
    color: #fff;
  }

  .search-btn:hover {
    background: var(--brand-dark);
  }

  .clear-btn {
    background: #e8edef;
    color: var(--brand-dark);
  }

  .clear-btn:hover {
    background: #dce5e8;
  }

  .results {
    margin-top: 22px;
  }

  .result-count {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .result-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 10px;
    background: #fff;
  }

  .result-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .location {
    font-size: 19px;
    font-weight: 700;
  }

  .state {
    color: var(--brand);
  }

  .county {
    color: var(--text);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .open-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 0 15px;
    border-radius: 7px;
    background: var(--brand);
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
  }

  .open-btn:hover {
    background: var(--brand-dark);
  }

  .note {
    margin-top: 11px;
    padding: 12px 14px;
    border-radius: 7px;
    background: #f1f5f6;
    color: #45565d;
    font-size: 15px;
    line-height: 1.5;
  }

  .red-flag {
    background: var(--danger-bg);
    color: var(--danger);
    border-left: 5px solid var(--danger);
    font-weight: 700;
    font-size: 18px;
    padding: 13px 15px;
  }

  .empty {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 9px;
    background: #fafcfc;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 0 16px 30px;
  }

  @media (max-width: 700px) {
    .fields {
      grid-template-columns: 1fr;
    }

    .section-heading {
      align-items: flex-start;
    }

    .result-top {
      flex-direction: column;
    }

    .actions {
      width: 100%;
    }
  }
</style>
</head>
<body>

<header>
  <img src="marshall-reddick-logo.png" alt="Marshall Reddick">
</header>

<main>
  <div class="page-title">
    <h1>Link Library</h1>
    <p>Quick access to Property Tax and Recorded Document search websites.</p>
  </div>

  <section class="search-section">
    <div class="section-heading">
      <h2>Property Tax Search</h2>
    </div>

    <div class="fields">
      <div>
        <label for="taxState">State</label>
        <div class="combo">
          <input id="taxState" autocomplete="off" placeholder="Type or select a state">
          <button type="button" class="combo-arrow" id="taxStateArrow" aria-label="Show states">▾</button>
          <div class="combo-menu" id="taxStates"></div>
        </div>
      </div>

      <div>
        <label for="taxCounty">County</label>
        <div class="combo">
          <input id="taxCounty" autocomplete="off" placeholder="Type or select a county">
          <button type="button" class="combo-arrow" id="taxCountyArrow" aria-label="Show counties">▾</button>
          <div class="combo-menu" id="taxCounties"></div>
        </div>
      </div>

      <button class="search-btn" id="taxSearch">SEARCH</button>
      <button class="clear-btn" id="taxClear">CLEAR</button>
    </div>

    <div class="results" id="taxResults"></div>
  </section>

  <section class="search-section">
    <div class="section-heading">
      <h2>Recorded Document Search</h2>
    </div>

    <div class="fields">
      <div>
        <label for="recordingState">State</label>
        <div class="combo">
          <input id="recordingState" autocomplete="off" placeholder="Type or select a state">
          <button type="button" class="combo-arrow" id="recordingStateArrow" aria-label="Show states">▾</button>
          <div class="combo-menu" id="recordingStates"></div>
        </div>
      </div>

      <div>
        <label for="recordingCounty">County</label>
        <div class="combo">
          <input id="recordingCounty" autocomplete="off" placeholder="Type or select a county">
          <button type="button" class="combo-arrow" id="recordingCountyArrow" aria-label="Show counties">▾</button>
          <div class="combo-menu" id="recordingCounties"></div>
        </div>
      </div>

      <button class="search-btn" id="recordingSearch">SEARCH</button>
      <button class="clear-btn" id="recordingClear">CLEAR</button>
    </div>

    <div class="results" id="recordingResults"></div>
  </section>
</main>

<footer>Marshall Reddick Link Library</footer>

<script>
const TAX_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1TFLooI6rcLQK7fjNDhCdZZD6PJJrzuWp6fFZ4srQ07z57yOWLg_d_ybGocuS-FKm-We_PY6fleOK/pub?gid=1852847162&single=true&output=csv";

const RECORDING_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1TFLooI6rcLQK7fjNDhCdZZD6PJJrzuWp6fFZ4srQ07z57yOWLg_d_ybGocuS-FKm-We_PY6fleOK/pub?gid=1489937388&single=true&output=csv";

let taxData = [];
let recordingData = [];

const stateMap = {
  "ALABAMA":"AL","ALASKA":"AK","ARIZONA":"AZ","ARKANSAS":"AR","CALIFORNIA":"CA",
  "COLORADO":"CO","CONNECTICUT":"CT","DELAWARE":"DE","FLORIDA":"FL","GEORGIA":"GA",
  "HAWAII":"HI","IDAHO":"ID","ILLINOIS":"IL","INDIANA":"IN","IOWA":"IA",
  "KANSAS":"KS","KENTUCKY":"KY","LOUISIANA":"LA","MAINE":"ME","MARYLAND":"MD",
  "MASSACHUSETTS":"MA","MICHIGAN":"MI","MINNESOTA":"MN","MISSISSIPPI":"MS",
  "MISSOURI":"MO","MONTANA":"MT","NEBRASKA":"NE","NEVADA":"NV","NEW HAMPSHIRE":"NH",
  "NEW JERSEY":"NJ","NEW MEXICO":"NM","NEW YORK":"NY","NORTH CAROLINA":"NC",
  "NORTH DAKOTA":"ND","OHIO":"OH","OKLAHOMA":"OK","OREGON":"OR","PENNSYLVANIA":"PA",
  "RHODE ISLAND":"RI","SOUTH CAROLINA":"SC","SOUTH DAKOTA":"SD","TENNESSEE":"TN",
  "TEXAS":"TX","UTAH":"UT","VERMONT":"VT","VIRGINIA":"VA","WASHINGTON":"WA",
  "WEST VIRGINIA":"WV","WISCONSIN":"WI","WYOMING":"WY",
  "DISTRICT OF COLUMBIA":"DC"
};

function normalizeState(value) {
  const raw = String(value || "").trim().toUpperCase();
  return stateMap[raw] || raw;
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];

    if (c === '"' && quoted && next === '"') {
      cell += '"'; i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === "," && !quoted) {
      row.push(cell); cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && next === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else {
      cell += c;
    }
  }

  row.push(cell);
  if (row.some(v => v.trim() !== "")) rows.push(row);

  if (!rows.length) return [];

  const headers = rows[0].map(h => h.trim().toLowerCase());

  // The published sheets use a fixed structure: State | County | Link | Notes.
  // Read by column position so Notes cannot be lost because of header formatting.
  const stateIndex = 0;
  const countyIndex = 1;
  const linkIndex = 2;
  const notesIndex = 3;

  return rows.slice(1).map(values => {
    return {
      state: normalizeState(values[stateIndex] || ""),
      county: (values[countyIndex] || "").trim(),
      link: (values[linkIndex] || "").trim(),
      notes: (values[notesIndex] || "").trim()
    };
  }).filter(r => r.state || r.county || r.link || r.notes);
}

async function loadSheet(url) {
  const response = await fetch(url + "&_=" + Date.now(), { cache: "no-store" });
  if (!response.ok) throw new Error("Unable to load sheet");
  return parseCSV(await response.text());
}

function sortData(data) {
  return [...data].sort((a, b) =>
    a.state.localeCompare(b.state) ||
    a.county.localeCompare(b.county)
  );
}

function populateComboMenu(values, id, inputId) {
  const menu = document.getElementById(id);
  menu.innerHTML = values.map(value =>
    `<div class="combo-option" data-value="${escapeHTML(value)}">${escapeHTML(value)}</div>`
  ).join("");

  menu.querySelectorAll(".combo-option").forEach(option => {
    option.addEventListener("mousedown", (event) => {
      event.preventDefault();
      document.getElementById(inputId).value = option.dataset.value;
      menu.classList.remove("open");
      document.getElementById(inputId).dispatchEvent(new Event("combochange"));
    });
  });
}

function filterComboMenu(values, inputValue, id, inputId) {
  const typed = String(inputValue || "").trim().toLowerCase();
  const matches = typed
    ? values.filter(v => v.toLowerCase().includes(typed))
    : values;

  populateComboMenu(matches, id, inputId);
  document.getElementById(id).classList.add("open");
}

function setupCombo(inputId, menuId, arrowId, getValues) {
  const input = document.getElementById(inputId);
  const menu = document.getElementById(menuId);
  const arrow = document.getElementById(arrowId);

  const showAll = () => {
    filterComboMenu(getValues(), "", menuId, inputId);
  };

  arrow.addEventListener("mousedown", (event) => {
    event.preventDefault();
    if (menu.classList.contains("open")) {
      menu.classList.remove("open");
    } else {
      showAll();
      input.focus();
    }
  });

  input.addEventListener("focus", showAll);

  input.addEventListener("input", () => {
    filterComboMenu(getValues(), input.value, menuId, inputId);
  });

  document.addEventListener("mousedown", (event) => {
    if (!event.target.closest(".combo")) {
      menu.classList.remove("open");
    }
  });
}

function setStates(data, menuId, inputId) {
  const states = [...new Set(data.map(x => x.state).filter(Boolean))].sort();
  const menu = document.getElementById(menuId);
  menu.dataset.values = JSON.stringify(states);
  populateComboMenu(states, menuId, inputId);
}

function setCounties(data, stateValue, menuId, inputId) {
  const state = normalizeState(stateValue);
  const counties = [...new Set(
    data.filter(x => !state || x.state === state)
      .map(x => x.county)
      .filter(Boolean)
  )].sort((a,b) => a.localeCompare(b));

  const menu = document.getElementById(menuId);
  menu.dataset.values = JSON.stringify(counties);
  populateComboMenu(counties, menuId, inputId);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

function isNA(link) {
  return !link || link.trim().toUpperCase() === "N/A";
}

function render(data, stateInput, countyInput, targetId) {
  const state = normalizeState(stateInput.value);
  const county = countyInput.value.trim().toLowerCase();

  const filtered = sortData(data.filter(item => {
    const stateMatch = !state || item.state === state;
    const countyMatch = !county || item.county.toLowerCase().includes(county);
    return stateMatch && countyMatch;
  }));

  const target = document.getElementById(targetId);

  if (!filtered.length) {
    target.innerHTML = `<div class="empty">No matching records found.</div>`;
    return;
  }

  target.innerHTML =
    `<div class="result-count">${filtered.length} result${filtered.length === 1 ? "" : "s"}</div>` +
    filtered.map(item => {
      const linkExists = !isNA(item.link);
      const noteExists = item.notes.trim() !== "";
      const redFlag = !linkExists || noteExists;

      // Any record with a Note is an ATTENTION item.
      // N/A without a Note also gets an ATTENTION warning.
      const displayNote = noteExists
        ? item.notes
        : (redFlag ? "No website available." : "");

      return `
        <div class="result-card">
          <div class="result-top">
            <div class="location">
              <span class="state">${escapeHTML(item.state)}</span>
              <span> — </span>
              <span class="county">${escapeHTML(item.county)}</span>
            </div>
            <div class="actions">
              ${linkExists
                ? `<a class="open-btn" href="${escapeHTML(item.link)}" target="_blank" rel="noopener">Open Website →</a>`
                : ""}
            </div>
          </div>
          ${displayNote
            ? `<div class="note ${redFlag ? "red-flag" : ""}">
                 ${redFlag ? "⚠ ATTENTION: " : ""}${escapeHTML(displayNote)}
               </div>`
            : ""}
        </div>
      `;
    }).join("");
}

function setupSearch(data, prefix, resultId) {
  const stateInput = document.getElementById(prefix + "State");
  const countyInput = document.getElementById(prefix + "County");
  const stateList = prefix === "tax" ? "taxStates" : "recordingStates";
  const countyList = prefix === "tax" ? "taxCounties" : "recordingCounties";
  const stateArrow = prefix + "StateArrow";
  const countyArrow = prefix + "CountyArrow";
  const searchBtn = document.getElementById(prefix + "Search");
  const clearBtn = document.getElementById(prefix + "Clear");
  const results = document.getElementById(resultId);

  const allStates = () => [...new Set(data.map(x => x.state).filter(Boolean))].sort();
  const availableCounties = () => {
    const state = normalizeState(stateInput.value);
    return [...new Set(
      data.filter(x => !state || x.state === state)
        .map(x => x.county)
        .filter(Boolean)
    )].sort((a,b) => a.localeCompare(b));
  };

  setStates(data, stateList, prefix + "State");
  setCounties(data, "", countyList, prefix + "County");

  setupCombo(prefix + "State", stateList, stateArrow, allStates);
  setupCombo(prefix + "County", countyList, countyArrow, availableCounties);

  const refreshCounties = () => {
    setCounties(data, stateInput.value, countyList, prefix + "County");
  };

  stateInput.addEventListener("input", refreshCounties);
  stateInput.addEventListener("combochange", () => {
    refreshCounties();
    // Keep the new state and let the user choose any county from it.
    countyInput.value = "";
  });

  searchBtn.addEventListener("click", () => {
    render(data, stateInput, countyInput, resultId);
  });

  clearBtn.addEventListener("click", () => {
    stateInput.value = "";
    countyInput.value = "";
    setCounties(data, "", countyList, prefix + "County");
    results.innerHTML = "";
  });
}

async function init() {
  try {
    [taxData, recordingData] = await Promise.all([
      loadSheet(TAX_URL),
      loadSheet(RECORDING_URL)
    ]);

    taxData = sortData(taxData);
    recordingData = sortData(recordingData);

    setupSearch(taxData, "tax", "taxResults");
    setupSearch(recordingData, "recording", "recordingResults");
  } catch (error) {
    document.querySelector("main").innerHTML =
      `<div class="empty">Unable to load the Link Library. Please try again.</div>`;
    console.error(error);
  }
}

init();
</script>

</body>
</html>
